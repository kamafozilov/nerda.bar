[package]
name = "nerda-bar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nerda Bar: AI subscription limits in the macOS menu bar, one item per provider, built with Rune"

[[bin]]
name = "nerda-bar"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a rev of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "b93b9effcbff974da98a27d7826a36787fcf0ff5" }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

# Rune builds against its own patched wgpu-hal; a dependency's [patch] does not reach this
# workspace, so repeat it here with the same rev as `rune` above.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "b93b9effcbff974da98a27d7826a36787fcf0ff5" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
